plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Sodium releases (same repo Iris uses)
	maven {
		name = 'CaffeineMC'
		url = 'https://maven.caffeinemc.net/releases'
	}
	// Fallback: Modrinth maven, e.g. "maven.modrinth:sodium:mc26.2-0.9.2-fabric"
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// We hook into Sodium's terrain renderer, so it is a hard dependency (compile + dev runtime).
	implementation "net.caffeinemc:sodium-fabric:${project.sodium_version}"
	// If the CaffeineMC maven is unreachable, drop the Sodium jar into libs/ and use this instead:
	// implementation files('libs/sodium-fabric-0.9.2+mc26.2.jar')
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
